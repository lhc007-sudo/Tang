<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tang molecular science platform</title>
  <desc id="desc">Electron orbit, vibrating nuclei and molecular dynamics symbols surrounding the Tang identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f55"/>
      <stop offset="0.55" stop-color="#225db8"/>
      <stop offset="1" stop-color="#3e86ee"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e9ff"/>
      <stop offset="1" stop-color="#12b9e7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65edb4"/>
      <stop offset="1" stop-color="#16b981"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="145" fill="#69a5ff" opacity=".2"/>
  <circle cx="80" cy="410" r="130" fill="#35d6e8" opacity=".13"/>
  <g transform="translate(70 70)">
    <text x="0" y="118" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="108" font-weight="750">Tang</text>
    <text x="5" y="166" fill="#83ecff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">MOLECULAR SCIENCE</text>
    <text x="5" y="222" fill="#e9f4ff" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25">电子结构 · 核运动 · 分子动力学</text>
    <rect x="5" y="256" width="365" height="4" rx="2" fill="#67e7ff" opacity=".8"/>
  </g>
  <g transform="translate(730 205)" fill="none" stroke-linecap="round">
    <ellipse rx="240" ry="76" stroke="url(#cyan)" stroke-width="8" transform="rotate(-18)" opacity=".95"/>
    <ellipse rx="210" ry="62" stroke="#b98bff" stroke-width="4" transform="rotate(53)" opacity=".65"/>
    <circle cx="0" cy="0" r="34" fill="#c87cff" stroke="#f1d8ff" stroke-width="4" filter="url(#glow)"/>
    <circle cx="44" cy="-12" r="28" fill="#45d9ff" stroke="#d8f9ff" stroke-width="4" filter="url(#glow)"/>
    <circle cx="223" cy="-64" r="16" fill="#7df2ff" stroke="#fff" stroke-width="3" filter="url(#glow)"/>
  </g>
  <g transform="translate(1010 285)" stroke="url(#green)" stroke-width="11" stroke-linecap="round">
    <path d="M-92 58 L-24 -31 L63 52 Z" fill="none"/>
    <circle cx="-92" cy="58" r="24" fill="#30d699" stroke="#d6fff1" stroke-width="4"/>
    <circle cx="-24" cy="-31" r="27" fill="#37dda0" stroke="#d6fff1" stroke-width="4"/>
    <circle cx="63" cy="52" r="29" fill="#26c98d" stroke="#d6fff1" stroke-width="4"/>
  </g>
  <g transform="translate(650 315)" fill="none" stroke="#c391ff" stroke-width="5" opacity=".8">
    <path d="M-60 0 C-40 -38 -20 -38 0 0 C20 38 40 38 60 0"/>
    <path d="M-82 0 C-55 -58 -27 -58 0 0 C27 58 55 58 82 0" opacity=".55"/>
  </g>
</svg>
